[package]
name = "esteid-cryptoki"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "Estonian ID card convenience layer over tokenkey"
repository = "https://github.com/takakv/tokenkey"
rust-version = "1.88"
keywords = ["id-card", "eid", "smartcard", "pkcs11"]
categories = ["authentication", "cryptography", "hardware-support"]

[dependencies]
tokenkey = { version = "0.1.2", path = "../tokenkey" }
x509-cert.workspace = true
thiserror.workspace = true

[dev-dependencies]
p384 = { version = "0.14", features = ["ecdh", "getrandom"] }
rpassword = "7"
